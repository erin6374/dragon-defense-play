name: Integration preview threat acceptance
on:
  push:
    branches:
      - integration/combined-preview
    paths:
      - 'qa/integration-threat-acceptance.mjs'
      - '.github/workflows/integration-threat-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-threat-${{ github.ref }}
  cancel-in-progress: false
jobs:
  threat:
    if: github.ref == 'refs/heads/integration/combined-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and syntax
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check qa/integration-threat-acceptance.mjs
          node qa/check-build-info.mjs
      - run: npm install --prefix "$RUNNER_TEMP/integration-qa" --no-save playwright-core@1.56.1
      - name: Run actual radar and meteor readability review
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > integration-threat-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/build-info.json >/dev/null; then break; fi
            sleep 1
          done
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/integration-qa/node_modules/playwright-core/index.mjs"
          node qa/integration-threat-acceptance.mjs
      - name: Retain threat screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-threat-${{ github.sha }}
          path: |
            integration-threat-output/
            integration-threat-server.log
          if-no-files-found: warn
          retention-days: 14
