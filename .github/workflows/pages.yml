name: Publish Dragon Defense to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public game files
        uses: actions/checkout@v4
      - name: Confirm this is a playable release
        run: |
          test -f index.html || { echo "::error::index.html is missing. Publish the web/ contents first."; exit 1; }
          test -f build-info.json || { echo "::error::build-info.json is missing."; exit 1; }
          python3 - <<'PY'
          import json
          b=json.load(open('build-info.json'))
          print('Deploying Dragon Defense',b.get('version'),b.get('build'))
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
