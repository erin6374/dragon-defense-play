name: Publish Dragon Defense to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Successful browser QA on our established development branch may publish
  # a /preview/ snapshot. The production root remains checked out from main.
  workflow_run:
    workflows: ["Dragon Defense browser QA"]
    types: [completed]
    branches: [feature/north-broad-graphics]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  qa:
    # Run the existing production QA before each deployment. For a preview
    # update, require its own browser QA to have succeeded first.
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    uses: ./.github/workflows/browser-qa.yml
  deploy:
    needs: qa
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out public game files
        uses: actions/checkout@v4
      - name: Confirm this is a playable release
        run: |
          test -f index.html || { echo "::error::index.html is missing. Publish the web/ contents first."; exit 1; }
          test -f build-info.json || { echo "::error::build-info.json is missing."; exit 1; }
          python3 - <<'PY'
          import json
          b=json.load(open('build-info.json'))
          print('Deploying Dragon Defense',b.get('version'),b.get('build'))
          PY
      - name: Download tested browser QA results
        uses: actions/download-artifact@v4
        with:
          name: dragon-defense-browser-qa
          path: qa/dashboard
      - name: Verify dashboard artifacts
        run: |
          test -f qa/dashboard/index.html
          test -f qa/dashboard/report.json
          python3 - <<'PY'
          import json
          build=json.load(open('build-info.json'))
          report=json.load(open('qa/dashboard/report.json'))
          assert report['expected']['version']==build['version'], 'QA/game version mismatch'
          assert report['expected']['build']==build['build'], 'QA/game build mismatch'
          assert not report.get('failure'), 'QA report recorded failure'
          assert not report.get('errors'), 'QA report recorded browser errors'
          PY
      # Every Pages deployment contains the unchanged production main files
      # at /, plus an isolated versioned preview at /preview/. On workflow_run
      # use the exact SHA that just passed the development browser QA rather
      # than potentially untested newer commits on its moving branch.
      - name: Check out development preview snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'release/v5.4.0-rc2' }}
          path: preview
          persist-credentials: false
      - name: Stage the independent playable preview
        run: |
          test -f preview/index.html
          test -f preview/src/game.js
          test -f preview/build-info.json
          test -f preview/vendor/three/build/three.module.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          main=json.loads(Path('build-info.json').read_text())
          preview=json.loads(Path('preview/build-info.json').read_text())
          print('Production:',main.get('version'),main.get('build'))
          print('Preview:',preview.get('version'),preview.get('build'))
          assert preview.get('version'), 'Preview version missing'
          assert main.get('build') != preview.get('build'), 'Preview should not silently match production'
          PY
          # Do not publish Git internals or a second copy of CI workflows.
          rm -rf preview/.git preview/.github preview/qa preview/dist
          # GitHub Pages static files are served verbatim by the Actions deploy.
          touch .nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload game site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in {1..18}; do
            if curl -fsS "${PAGE_URL%/}/build-info.json?run=${GITHUB_RUN_ID}-$attempt" -o /tmp/live-build.json &&
              cmp -s build-info.json /tmp/live-build.json &&
              curl -fsS "${PAGE_URL%/}/?run=${GITHUB_RUN_ID}-$attempt" -o /tmp/live-game.html &&
              cmp -s index.html /tmp/live-game.html &&
              curl -fsS "${PAGE_URL%/}/src/game.js?run=${GITHUB_RUN_ID}-$attempt" -o /tmp/live-game.js &&
              cmp -s src/game.js /tmp/live-game.js &&
              curl -fsS "${PAGE_URL%/}/qa/dashboard/report.json?run=${GITHUB_RUN_ID}-$attempt" -o /tmp/live-qa.json &&
              cmp -s qa/dashboard/report.json /tmp/live-qa.json &&
              curl -fsS "${PAGE_URL%/}/preview/build-info.json?run=${GITHUB_RUN_ID}-$attempt" -o /tmp/live-preview-build.json &&
              cmp -s preview/build-info.json /tmp/live-preview-build.json &&
              curl -fsS "${PAGE_URL%/}/preview/index.html?run=${GITHUB_RUN_ID}-$attempt" -o /tmp/live-preview-index.html &&
              cmp -s preview/index.html /tmp/live-preview-index.html &&
              curl -fsS "${PAGE_URL%/}/preview/src/game.js?run=${GITHUB_RUN_ID}-$attempt" -o /tmp/live-preview-game.js &&
              cmp -s preview/src/game.js /tmp/live-preview-game.js; then
              cat /tmp/live-build.json
              exit 0
            fi
            sleep 5
          done
          exit 1
