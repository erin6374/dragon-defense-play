name: Dragon Defense browser QA
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
# Avoid running obsolete full software-WebGL suites for superseded PR heads.
concurrency:
  group: dragon-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Test the PR's actual head, not GitHub's synthetic PR merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact PR head checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          echo "Checked out: $actual"
          echo "Expected:    $EXPECTED_HEAD_SHA"
          test "$actual" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check build labels before browser startup
        run: |
          node qa/check-build-info.mjs
          node qa/frontage-contract.mjs
          node qa/street-surface-contract.mjs
          node qa/smoke-plume-contract.mjs
          python3 qa/windows-preview-server-test.py
          python3 qa/windows-performance-analysis-test.py
      - run: npm install --prefix "$RUNNER_TEMP/dragon-qa" --no-save playwright-core@1.56.1
      - run: google-chrome --version
      - name: Run browser QA
        env:
          QA_BROWSER_CHANNEL: chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/dragon-qa/node_modules/playwright-core/index.mjs"
          node qa/browser.mjs
      - name: Diagnose published Pages provenance (nonblocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          node qa/pages-provenance.cjs --self-test
          node qa/pages-provenance.cjs
      - name: Retain screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragon-defense-browser-qa
          path: qa-output/
          retention-days: 30

      - name: Package playable Windows development preview
        if: success()
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          import json
          import os
          import subprocess
          source = Path('.')
          target = Path('dist/DragonDefense_Development_Preview')
          target.mkdir(parents=True, exist_ok=True)
          ignored = {'.git', '.github', 'qa', 'qa-output', 'dist', 'node_modules', '.vscode', '__pycache__'}
          for entry in source.iterdir():
              if entry.name in ignored:
                  continue
              dest = target / entry.name
              if entry.is_dir():
                  shutil.copytree(entry, dest, ignore=shutil.ignore_patterns('__pycache__', '*.pyc'))
              elif entry.is_file():
                  shutil.copy2(entry, dest)
          required = ('index.html', 'PLAY-PREVIEW.cmd', 'tools/windows-preview-server.py', 'src/game.js',
                      'vendor/three/build/three.module.js', 'build-info.json',
                      'src/dragon/paulo-rig.js', 'README_WINDOWS_V5.4_RC2.txt')
          missing = [name for name in required if not (target / name).is_file()]
          if missing:
              raise SystemExit('Missing preview files: ' + ', '.join(missing))
          tested_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if tested_sha != os.environ['EXPECTED_HEAD_SHA']:
              raise SystemExit('Preview commit mismatch: ' + tested_sha)
          info = json.loads((target / 'build-info.json').read_text(encoding='utf-8'))
          (target / 'PREVIEW-BUILD.txt').write_text(
              f"Tested commit: {tested_sha}\nVersion: {info['version']}\nBuild: {info['build']}\n"
              f"Browser QA: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n"
              'Development preview only; no production or Pages deployment.\n',
              encoding='utf-8')
          print('Packaged playable files:', sum(1 for p in target.rglob('*') if p.is_file()))
          PY
      - name: Downloadable Dragon Defense Windows preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DragonDefense_Development_Preview
          path: dist/DragonDefense_Development_Preview/
          retention-days: 30
