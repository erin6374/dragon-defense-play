name: Dragon Defense browser QA
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
# Avoid running obsolete full software-WebGL suites for superseded PR heads.
concurrency:
  group: dragon-browser-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/dragon-qa" --no-save playwright-core@1.56.1
      - run: google-chrome --version
      - name: Run browser QA
        env:
          QA_BROWSER_CHANNEL: chrome
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/dragon-qa/node_modules/playwright-core/index.mjs"
          node qa/browser.mjs
      - name: Retain screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dragon-defense-browser-qa
          path: qa-output/
          retention-days: 30

      - name: Package playable Windows development preview
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('.')
          target = Path('dist/DragonDefense_v5.4.0_RC5_Windows_Preview')
          target.mkdir(parents=True, exist_ok=True)
          ignored = {'.git', '.github', 'qa', 'qa-output', 'dist', 'node_modules', '.vscode', '__pycache__'}
          for entry in source.iterdir():
              if entry.name in ignored:
                  continue
              dest = target / entry.name
              if entry.is_dir():
                  shutil.copytree(entry, dest, ignore=shutil.ignore_patterns('__pycache__', '*.pyc'))
              elif entry.is_file():
                  shutil.copy2(entry, dest)
          required = ('index.html', 'PLAY-PREVIEW.cmd', 'src/game.js',
                      'vendor/three/build/three.module.js', 'build-info.json',
                      'src/dragon/paulo-rig.js', 'README_WINDOWS_V5.4_RC2.txt')
          missing = [name for name in required if not (target / name).is_file()]
          if missing:
              raise SystemExit('Missing preview files: ' + ', '.join(missing))
          print('Packaged playable files:', sum(1 for p in target.rglob('*') if p.is_file()))
          PY
      - name: Downloadable Dragon Defense Windows preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DragonDefense_v5.4.0_RC5_Windows_Preview
          path: dist/DragonDefense_v5.4.0_RC5_Windows_Preview/
          retention-days: 30
