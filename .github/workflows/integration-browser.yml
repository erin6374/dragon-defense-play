name: Integration preview browser acceptance
on:
  push:
    branches:
      - integration/combined-preview
    paths:
      - 'qa/integration-browser.mjs'
      - '.github/workflows/integration-browser.yml'
      - 'src/**'
      - 'broad-street/**'
      - 'assets/**'
      - 'index.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    if: github.ref == 'refs/heads/integration/combined-preview'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate checkout and runtime metadata
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node qa/check-build-info.mjs
          node --check qa/integration-browser.mjs
      - run: npm install --prefix "$RUNNER_TEMP/integration-qa" --no-save playwright-core@1.56.1
      - name: Run focused integrated browser probes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >integration-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/build-info.json >/dev/null; then break; fi
            sleep 1
          done
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/integration-qa/node_modules/playwright-core/index.mjs"
          node qa/integration-browser.mjs
      - name: Retain diagnostic screenshots and JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-browser-${{ github.sha }}
          path: |
            integration-browser-output/
            integration-server.log
          if-no-files-found: warn
          retention-days: 14
