name: Park13 integration pilot
on:
  push:
    branches:
      - integration/preview-11-park13
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: park13-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and architecture
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node qa/check-build-info.mjs
          node tests/integration-preview-regressions.mjs
          node tests/park13-integration-audit.mjs
      - run: npm install --prefix "$RUNNER_TEMP/integration-qa" --no-save playwright-core@1.56.1
      - name: Compare actual browser expansion and baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > park13-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/build-info.json >/dev/null; then break; fi
            sleep 1
          done
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/integration-qa/node_modules/playwright-core/index.mjs"
          node qa/park13-integration-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: park13-integration-${{ github.sha }}
          path: |
            park13-integration-output/
            park13-server.log
          retention-days: 14
          if-no-files-found: warn
